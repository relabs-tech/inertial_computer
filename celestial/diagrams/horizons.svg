<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 520 480' width='520' height='480'>
<defs><radialGradient id='gEarth2' cx='32%' cy='28%' r='78%'><stop offset='0%' stop-color='#274870'/><stop offset='100%' stop-color='#0a1420'/></radialGradient></defs>
<rect x='1' y='1' width='518' height='478' rx='12' fill='#0e1220' stroke='#232a42' stroke-width='2'/>
<text x='260.0' y='30.0' fill='#e7ebf5' font-size='13.5' text-anchor='middle' font-weight='600' font-family='Space Grotesk, Helvetica, Arial, sans-serif'>Observer's horizon vs. the celestial horizon</text>
<line x1='24' y1='52' x2='50' y2='52' stroke='#e7ebf5' stroke-width='2.25' stroke-linecap='round'/>
<text x='58.0' y='56.0' fill='#e7ebf5' font-size='12' text-anchor='start' font-weight='500' font-family='Space Grotesk, Helvetica, Arial, sans-serif'>Sensible horizon (tangent at observer)</text>
<line x1='24' y1='72' x2='50' y2='72' stroke='#5b8dd9' stroke-width='2.25' stroke-dasharray='6,4' stroke-linecap='round'/>
<text x='58.0' y='76.0' fill='#5b8dd9' font-size='12' text-anchor='start' font-weight='500' font-family='Space Grotesk, Helvetica, Arial, sans-serif'>Celestial horizon (through Earth's centre)</text>
<line x1='100' y1='340' x2='168' y2='340' stroke='#5b8dd9' stroke-width='2.25' stroke-dasharray='7,5' stroke-linecap='round'/>
<line x1='352' y1='340' x2='420' y2='340' stroke='#5b8dd9' stroke-width='2.25' stroke-dasharray='7,5' stroke-linecap='round'/>
<circle cx='260' cy='340' r='92' fill='url(#gEarth2)' stroke='#4a5272' stroke-width='1.5'/>
<text x='260.0' y='345.0' fill='#8892ac' font-size='11.5' text-anchor='middle' font-weight='500' font-family='Space Grotesk, Helvetica, Arial, sans-serif'>Earth</text>
<line x1='100' y1='248' x2='420' y2='248' stroke='#e7ebf5' stroke-width='2.25' stroke-linecap='round'/>
<circle cx='260.00' cy='248.00' r='5' fill='#e7ebf5'/>
<text x='250.0' y='266.0' fill='#e7ebf5' font-size='12' text-anchor='end' font-weight='700' font-family='Space Grotesk, Helvetica, Arial, sans-serif'>O</text>
<circle cx='260.00' cy='340.00' r='4.5' fill='#8892ac'/>
<text x='250.0' y='358.0' fill='#8892ac' font-size='12' text-anchor='end' font-weight='700' font-family='Space Grotesk, Helvetica, Arial, sans-serif'>C</text>
<line x1='260' y1='248' x2='260' y2='136' stroke='#8892ac' stroke-width='2' stroke-dasharray='2,4' stroke-linecap='round'/>
<text x='260.0' y='128.0' fill='#8892ac' font-size='12' text-anchor='middle' font-weight='600' font-family='Space Grotesk, Helvetica, Arial, sans-serif'>Zenith (Z)</text>
<line x1='260' y1='248' x2='407.45' y2='144.76' stroke='#e0b04a' stroke-width='2.5' stroke-linecap='round'/>
<circle cx='407.45' cy='144.76' r='5' fill='#e0b04a'/>
<text x='415.4' y='138.8' fill='#e0b04a' font-size='12.5' text-anchor='start' font-weight='700' font-family='Space Grotesk, Helvetica, Arial, sans-serif'>Body</text>
<line x1='260' y1='340' x2='392.70' y2='247.08' stroke='#e0b04a' stroke-width='1.8' stroke-dasharray='6,4' stroke-linecap='round' opacity='0.85'/>
<path d='M 296.04,222.76 A 44.00,44.00 0 0 1 304.00,248.00' stroke='#e0803f' stroke-width='2' fill='none' stroke-dasharray='5,4'/>
<text x='317.2' y='230.0' fill='#e0803f' font-size='13' text-anchor='middle' font-weight='700' font-family='Space Grotesk, Helvetica, Arial, sans-serif'>Hs</text>
<path d='M 260.00,170.00 A 78.00,78.00 0 0 1 323.89,203.26' stroke='#6fb389' stroke-width='2' fill='none' stroke-dasharray='5,4'/>
<text x='304.3' y='162.8' fill='#6fb389' font-size='11.5' text-anchor='middle' font-weight='700' font-family='Space Grotesk, Helvetica, Arial, sans-serif'>Zenith distance</text>
<path d='M 292.77,317.06 A 40.00,40.00 0 0 1 300.00,340.00' stroke='#e0803f' stroke-width='1.8' fill='none' stroke-dasharray='4,3' opacity='0.85'/>
<text x='311.5' y='323.8' fill='#e0803f' font-size='11' text-anchor='middle' font-weight='700' font-family='Space Grotesk, Helvetica, Arial, sans-serif'>≈ Hs</text>
<text x='260.0' y='418.0' fill='#e7ebf5' font-size='13' text-anchor='middle' font-weight='600' font-family='Space Grotesk, Helvetica, Arial, sans-serif'>Zenith distance = 90° − Hs</text>
<text x='260.0' y='442.0' fill='#8892ac' font-size='11.5' text-anchor='middle' font-weight='500' font-family='Space Grotesk, Helvetica, Arial, sans-serif'>Body effectively at infinity ⇒ rays to O and C are parallel.</text>
<text x='260.0' y='462.0' fill='#8892ac' font-size='11.5' text-anchor='middle' font-weight='500' font-family='Space Grotesk, Helvetica, Arial, sans-serif'>So Hs is (almost) unchanged if the horizon is shifted to Earth's centre.</text>
</svg>